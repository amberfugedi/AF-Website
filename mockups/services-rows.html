<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Mockup — wide numbered rows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../styles.css">
<style>
.mk-bar { position: sticky; top: 0; z-index: 40; background: var(--bg); border-bottom: 1px solid var(--line); padding: 11px 0; }
.mk-bar strong { font-family: var(--font-body); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--coral-deep); }
.rw-head h2 { margin-bottom: 10px; }
.rw-head p { color: var(--muted); max-width: 52ch; }

.rw-list { margin-top: clamp(30px, 4vw, 46px); }
.rw-row { border-top: 1px solid rgba(84, 76, 112, .22); }
.rw-row:last-child { border-bottom: 1px solid rgba(84, 76, 112, .22); }

/* the whole row is the control — number and label, nothing boxed */
.rw-btn { font-family: var(--font-body); background: none; border: 0; cursor: pointer; width: 100%;
  display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; align-items: baseline; gap: 0 18px;
  padding: 26px 0; text-align: left; color: var(--body); transition: color .2s var(--ease); }
.rw-n { font-size: var(--fs-eyebrow); letter-spacing: .1em; font-weight: 600; color: var(--muted); transition: color .2s; }
.rw-l { font-family: var(--font-display); font-weight: 500; letter-spacing: -.02em; line-height: 1.15;
  font-size: var(--fs-h3); position: relative;
  /* hug the words: as a 1fr grid item the butter tab stretched the
     full column and read as a filled bar. */
  justify-self: start; }
.rw-l::before { content: ""; position: absolute; inset: -5px -10px -4px -8px; border-radius: 2px; background: #FBE7A8;
  opacity: 0; transform: scaleX(.92); transform-origin: left center; z-index: -1;
  transition: opacity .26s var(--ease), transform .26s var(--ease); }
.rw-mark { width: 16px; height: 2px; background: rgba(84, 76, 112, .34); align-self: center;
  transform: scaleX(.55); transform-origin: right center; transition: background .22s, transform .22s; }
.rw-btn:hover { color: var(--ink); }
.rw-row.on .rw-btn { color: var(--ink); }
.rw-row.on .rw-n { color: var(--coral-deep); }
.rw-row.on .rw-l::before { opacity: 1; transform: scaleX(1); }
.rw-row.on .rw-mark { background: var(--coral-deep); transform: scaleX(1); }

.rw-body[hidden] { display: none; }
.rw-body { padding: 0 0 38px; }
.rw-in { animation: rw-in .3s var(--ease) both; }
@keyframes rw-in { from { opacity: 0; } to { opacity: 1; } }
.rw-cols { display: grid; grid-template-columns: minmax(0, 58fr) minmax(0, 42fr);
  gap: clamp(26px, 4vw, 66px); align-items: center; padding-left: 80px; }
.rw-k { text-transform: uppercase; letter-spacing: .08em; font-weight: 600; font-size: var(--fs-eyebrow); color: var(--muted); margin: 0 0 7px; }
.rw-cols p:not(.rw-k) { color: var(--body); font-size: var(--fs-body); line-height: 1.55; margin: 0 0 20px; max-width: 52ch; }
.rw-cols .rw-cta { margin: 4px 0 0; }
.rw-sheet { display: block; width: 100%; height: auto; background: #FFFDFA;
  border: 1px solid rgba(46, 42, 39, .11); border-radius: 3px;
  box-shadow: 0 20px 42px -36px rgba(46, 42, 39, .38); }
@media (prefers-reduced-motion: reduce) { .rw-in { animation: none; } .rw-btn, .rw-l::before, .rw-mark { transition: none; } }

@media (max-width: 860px) {
  .rw-btn { grid-template-columns: 40px minmax(0, 1fr) auto; padding: 20px 0; gap: 0 12px; }
  .rw-cols { grid-template-columns: 1fr; gap: 22px; padding-left: 0; }
  .rw-cols p:not(.rw-k) { max-width: none; }
  .rw-body { padding-bottom: 28px; }
}
</style></head>
<body class="page-sub">
<div class="aura" aria-hidden="true"><span class="aura-blob aura-blob-1"></span><span class="aura-blob aura-blob-2"></span><span class="aura-blob aura-blob-3"></span></div>
<div class="mk-bar"><div class="wrap"><strong>Mockup · not linked from the site</strong></div></div>
<main><section><div class="wrap">
  <div class="rw-head">
    <h2 class="section-title">Choose your starting point</h2>
    <p>Different businesses need different kinds of help. Start with the situation that feels closest.</p>
  </div>
  <div class="rw-list"></div>
</div></section></main>
<script>
var F='Newsreader, Georgia, serif', M='Manrope, system-ui, sans-serif';
/* same sheet in every row — same margin rule, same heading, same four
   faint lines. only what is written on it changes. */
function sheet(state){ return '<svg class="rw-sheet" viewBox="0 0 420 300" fill="none" stroke-linecap="round" role="img" aria-hidden="true">' +
 '<text x="34" y="40" fill="#8A827A" font-family="'+M+'" font-size="9" letter-spacing="1.4">THE PLAN</text>' +
 '<path d="M34 52 Q210 50.4 388 52.4" stroke="#3A3531" stroke-width="1" opacity="0.38"/>' +
 '<path d="M62 24 Q60 160 62 278" stroke="#3A3531" stroke-width="0.9" opacity="0.16"/>' +
 '<g stroke="#3A3531" stroke-width="0.9" opacity="0.2"><path d="M76 92 Q220 90.6 386 92.4"/><path d="M76 124 Q200 122.7 344 124.5"/>' +
 '<path d="M76 156 Q230 154.6 388 156.4"/><path d="M76 188 Q190 186.8 316 188.6"/></g>' + state + '</svg>'; }

var ST = [
 '<text x="76" y="238" fill="#B8354A" font-family="'+F+'" font-style="italic" font-size="19">Where do we even start?</text>' +
 '<path d="M72 250 Q160 246 262 251" stroke="#B8354A" stroke-width="1.4"/>',

 '<g fill="#3A3531" font-family="'+F+'" font-style="italic" font-size="15">' +
 '<text x="76" y="88">Website</text><text x="212" y="84">Emails</text><text x="316" y="90">Social</text>' +
 '<text x="76" y="120">Follow up</text><text x="212" y="124">Newsletter</text>' +
 '<text x="76" y="152">Fix this</text><text x="196" y="156">Reporting</text><text x="316" y="150">Deck</text>' +
 '<text x="76" y="184">Ads</text><text x="160" y="188">SEO</text><text x="252" y="182">Launch</text></g>' +
 '<g stroke="#3A3531" stroke-width="1" opacity="0.42"><path d="M74 114 Q108 112 142 114.6"/><path d="M74 146 Q100 144 128 146.6"/></g>' +
 '<g stroke="#B8354A" stroke-width="1.4"><path d="M72 178 Q104 175.6 138 178.8"/>' +
 '<path d="M366 106 Q392 168, 342 224"/><path d="M342 224 L354 219 M342 224 L353 230"/></g>' +
 '<text x="256" y="248" fill="#B8354A" font-family="'+F+'" font-style="italic" font-size="17">all mine</text>',

 '<g fill="#3A3531" font-family="'+F+'" font-style="italic" font-size="15">' +
 '<text x="76" y="88">Campaign launch</text><text x="76" y="120">Pricing page</text><text x="76" y="152">Sales enablement</text></g>' +
 '<g fill="#8A827A" font-family="'+M+'" font-size="8.5" letter-spacing="1.1"><text x="262" y="76">MARKETING</text><text x="262" y="140">SALES</text></g>' +
 '<g stroke="#B8354A" stroke-width="1.4"><path d="M258 86 Q226 92 200 86"/><path d="M200 86 L210 83 M200 86 L209 90"/>' +
 '<path d="M258 150 Q226 144 200 150"/><path d="M200 150 L210 147 M200 150 L209 154"/></g>' +
 '<g fill="#B8354A" font-family="'+F+'" font-style="italic" font-size="15"><text x="266" y="92">Launch now</text><text x="266" y="156">Wait for us</text></g>' +
 '<text x="76" y="240" fill="#B8354A" font-family="'+F+'" font-style="italic" font-size="18">Who owns this?</text>' +
 '<path d="M72 252 Q140 248 210 253" stroke="#B8354A" stroke-width="1.4"/>',

 '<g fill="#3A3531" font-family="'+F+'" font-style="italic" font-size="15">' +
 '<text x="76" y="88">Where the team is stuck</text><text x="76" y="120">What I keep deferring</text><text x="76" y="152">The call I have to make</text></g>' +
 '<g stroke="#B8354A" stroke-width="1.4"><path d="M40 80 Q36 124 40 168"/>' +
 '<path d="M300 116 Q330 118 358 114"/><path d="M358 114 L349 111 M358 114 L350 118"/></g>' +
 '<text x="76" y="240" fill="#B8354A" font-family="'+F+'" font-style="italic" font-size="18">Talk this through with me.</text>' +
 '<path d="M72 252 Q168 248 288 253" stroke="#B8354A" stroke-width="1.4"/>'
];

var S=[
 {l:"No marketing yet",h:"The business works, but marketing has never been clearly defined. You need clarity on what matters, what to build, and what can wait.",p:"I help create the positioning, priorities, and practical foundation the business actually needs.",s:"Build Your Marketing Foundation or a focused strategy engagement.",c:"Explore the course",u:"../courses.html"},
 {l:"It all depends on me",h:"Marketing lives in your head, your calendar, and a collection of disconnected people or tools.",p:"I simplify the work, create clearer systems, and reduce how much depends on one person.",s:"Workflow and AI advisory or focused consulting.",c:"See how I work",u:"../my-approach.html"},
 {l:"The team is not aligned",h:"There is plenty of activity, but priorities, ownership, messaging, or decisions are not working together.",p:"I find where the work is breaking down and help the team move the right changes forward.",s:"Strategic consulting, fractional leadership, or a cross-functional project.",c:"See the expertise in action",u:"../expertise.html"},
 {l:"I need someone in my corner",h:"You are leading the work, growing into a larger role, or making difficult decisions without an experienced person to pressure-test them with.",p:"I provide practical guidance, honest perspective, and ongoing thought partnership.",s:"One-to-one mentoring or marketing leadership advisory.",c:"Ask about mentoring",u:"../about.html#contact"}
];

var list=document.querySelector(".rw-list");
S.forEach(function(d,i){
 var row=document.createElement("div"); row.className="rw-row"+(i===0?" on":"");
 row.innerHTML =
  '<h3 style="margin:0"><button type="button" class="rw-btn" id="rw-b-'+i+'" aria-expanded="'+(i===0)+'" aria-controls="rw-p-'+i+'">' +
  '<span class="rw-n">0'+(i+1)+'</span><span class="rw-l">'+d.l+'</span><span class="rw-mark" aria-hidden="true"></span></button></h3>' +
  '<div class="rw-body'+(i===0?" rw-in":"")+'" id="rw-p-'+i+'" role="region" aria-labelledby="rw-b-'+i+'"'+(i===0?"":" hidden")+'>' +
  '<div class="rw-cols"><div>' +
  '<p class="rw-k">What may be happening</p><p>'+d.h+'</p>' +
  '<p class="rw-k">How I help</p><p>'+d.p+'</p>' +
  '<p class="rw-k">Best place to start</p><p>'+d.s+'</p>' +
  '<p class="rw-cta"><a class="arrow-link" href="'+d.u+'">'+d.c+'</a></p></div>' +
  '<div>'+sheet(ST[i])+'</div></div></div>';
 list.appendChild(row);
});

var rows=[].slice.call(document.querySelectorAll(".rw-row"));
rows.forEach(function(row,i){
 row.querySelector(".rw-btn").addEventListener("click",function(){
  rows.forEach(function(r,j){
   var open=j===i, body=r.querySelector(".rw-body");
   r.classList.toggle("on",open);
   r.querySelector(".rw-btn").setAttribute("aria-expanded",String(open));
   body.hidden=!open;
   if(open){ body.classList.remove("rw-in"); void body.offsetWidth; body.classList.add("rw-in"); }
  });
 });
});
</script>
</body></html>
