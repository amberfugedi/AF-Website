<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Mockup — Choose your starting point</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../styles.css">
<style>
.mk-bar { position: sticky; top: 0; z-index: 40; background: var(--bg); border-bottom: 1px solid var(--line); padding: 11px 0; }
.mk-bar strong { font-family: var(--font-body); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--coral-deep); }

/* ---------- the route ---------- */
.sp-head h2 { margin-bottom: 10px; }
.sp-head p { color: var(--muted); max-width: 52ch; }

.sp-route { position: relative; margin-top: clamp(34px, 4vw, 56px); }
.sp-line { display: block; width: 100%; aspect-ratio: 1200 / 104; overflow: visible; }
.sp-line .rule { stroke: rgba(84, 76, 112, .34); stroke-width: 1.2; fill: none; stroke-linecap: round; }
.sp-line .node { fill: var(--bg); stroke: rgba(84, 76, 112, .42); stroke-width: 1.2; transition: stroke .22s var(--ease), fill .22s var(--ease); }
.sp-line .node.on { fill: #F2A93B; stroke: #9E762C; }

.sp-stops { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 clamp(12px, 2vw, 30px); }
.sp-stop {
  font-family: var(--font-body); background: none; border: 0; cursor: pointer; padding: 0;
  display: flex; flex-direction: column; align-items: flex-start; gap: 5px;
  text-align: left; color: var(--body); transition: color .2s var(--ease);
}
/* each stop steps with the route rather than sitting on one baseline */
.sp-stop:nth-child(1) { margin-top: 40px; }
.sp-stop:nth-child(2) { margin-top: 8px; }
.sp-stop:nth-child(3) { margin-top: 26px; }
.sp-stop:nth-child(4) { margin-top: 0; }
.sp-n { font-size: var(--fs-eyebrow); letter-spacing: .1em; font-weight: 600; color: var(--muted); transition: color .2s; }
.sp-l { font-size: var(--fs-intro); line-height: 1.2; letter-spacing: -.005em; position: relative; transition: transform .22s var(--ease); }
/* the butter tab, drawn the way the paper tabs are drawn elsewhere */
.sp-l::before {
  content: ""; position: absolute; inset: -5px -9px -4px -7px; border-radius: 2px;
  background: #FBE7A8; opacity: 0; transform: scaleX(.9); transform-origin: left center;
  transition: opacity .22s var(--ease), transform .22s var(--ease); z-index: -1;
}
.sp-stop:hover { color: var(--ink); }
.sp-stop[aria-selected="true"] { color: var(--ink); }
.sp-stop[aria-selected="true"] .sp-n { color: var(--coral-deep); }
.sp-stop[aria-selected="true"] .sp-l { font-weight: 600; transform: translateY(-2px); }
.sp-stop[aria-selected="true"] .sp-l::before { opacity: 1; transform: scaleX(1); }

/* ---------- the one explanation ---------- */
.sp-panel { margin-top: clamp(40px, 4.5vw, 66px); padding-top: 26px; border-top: 1px solid rgba(84, 76, 112, .22); }
.sp-panel[hidden] { display: none; }
.sp-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: clamp(22px, 3vw, 52px); align-items: start; }
.sp-k { text-transform: uppercase; letter-spacing: .08em; font-weight: 600; font-size: var(--fs-eyebrow); color: var(--muted); margin: 0 0 7px; }
.sp-cols p:not(.sp-k) { color: var(--body); font-size: var(--fs-body); line-height: 1.55; margin: 0; max-width: 34ch; }
.sp-cta { align-self: center; }
.sp-in { animation: sp-in .26s var(--ease) both; }
@keyframes sp-in { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .sp-in { animation: none; }
  .sp-l, .sp-l::before, .sp-line .node { transition: none; }
}

@media (max-width: 860px) {
  /* the route turns vertical: one hairline down the left, four stops on it */
  .sp-line { display: none; }
  .sp-stops { grid-template-columns: 1fr; gap: 0; position: relative; padding-left: 26px; }
  .sp-stops::before { content: ""; position: absolute; left: 4px; top: 14px; bottom: 14px; width: 1px; background: rgba(84, 76, 112, .3); }
  .sp-stop { margin-top: 0 !important; padding: 15px 0; position: relative; flex-direction: row; align-items: baseline; gap: 11px; }
  .sp-stop::before { content: ""; position: absolute; left: -26px; top: 21px; width: 9px; height: 9px; border-radius: 50%;
    background: var(--bg); border: 1.2px solid rgba(84, 76, 112, .42); box-sizing: border-box; transition: background .2s, border-color .2s; }
  .sp-stop[aria-selected="true"]::before { background: #F2A93B; border-color: #9E762C; }
  .sp-cols { grid-template-columns: 1fr; gap: 20px; }
  .sp-cols p:not(.sp-k) { max-width: none; }
}
</style>
</head>
<body class="page-sub">
<div class="aura" aria-hidden="true"><span class="aura-blob aura-blob-1"></span><span class="aura-blob aura-blob-2"></span><span class="aura-blob aura-blob-3"></span></div>
<div class="mk-bar"><div class="wrap"><strong>Mockup · not linked from the site</strong></div></div>

<main><section><div class="wrap">
  <div class="sp-head">
    <h2 class="section-title">Choose your starting point</h2>
    <p>Different businesses need different kinds of help. Start with the situation that feels closest.</p>
  </div>

  <div class="sp-route">
    <svg class="sp-line" viewBox="0 0 1200 104" fill="none" aria-hidden="true">
      <path class="rule" d="M-30 84 C 60 82, 108 78, 150 74 C 240 66, 330 38, 450 34
                            C 560 30, 660 54, 750 56 C 850 58, 940 30, 1050 22
                            C 1130 16, 1180 16, 1230 18"/>
      <circle class="node" data-node="0" cx="150" cy="74" r="5.5"/>
      <circle class="node" data-node="1" cx="450" cy="34" r="5.5"/>
      <circle class="node" data-node="2" cx="750" cy="56" r="5.5"/>
      <circle class="node" data-node="3" cx="1050" cy="22" r="5.5"/>
    </svg>
    <div class="sp-stops" role="tablist" aria-label="Starting points"></div>
  </div>

  <div class="sp-panels"></div>
</div></section></main>

<script>
var STOPS = [
 {label:"No marketing yet",
  happening:"The business works, but marketing has never been clearly defined. You need clarity on what matters, what to build, and what can wait.",
  help:"I help create the positioning, priorities, and practical foundation the business actually needs.",
  start:"Build Your Marketing Foundation or a focused strategy engagement.",
  cta:"Explore the course", href:"../courses.html"},
 {label:"It all depends on me",
  happening:"Marketing lives in your head, your calendar, and a collection of disconnected people or tools.",
  help:"I simplify the work, create clearer systems, and reduce how much depends on one person.",
  start:"Workflow and AI advisory or focused consulting.",
  cta:"See how I work", href:"../my-approach.html"},
 {label:"The team is not aligned",
  happening:"There is plenty of activity, but priorities, ownership, messaging, or decisions are not working together.",
  help:"I find where the work is breaking down and help the team move the right changes forward.",
  start:"Strategic consulting, fractional leadership, or a cross-functional project.",
  cta:"See the expertise in action", href:"../expertise.html"},
 {label:"I need someone in my corner",
  happening:"You are leading the work, growing into a larger role, or making difficult decisions without an experienced person to pressure-test them with.",
  help:"I provide practical guidance, honest perspective, and ongoing thought partnership.",
  start:"One-to-one mentoring or marketing leadership advisory.",
  cta:"Ask about mentoring", href:"../about.html#contact"}
];

var stops = document.querySelector(".sp-stops"), panels = document.querySelector(".sp-panels");
var nodes = document.querySelectorAll(".sp-line .node");

STOPS.forEach(function (s, i) {
  var b = document.createElement("button");
  b.type = "button"; b.className = "sp-stop"; b.setAttribute("role", "tab");
  b.id = "sp-tab-" + i; b.setAttribute("aria-controls", "sp-panel-" + i);
  b.setAttribute("aria-selected", i === 0 ? "true" : "false");
  b.tabIndex = i === 0 ? 0 : -1;
  b.innerHTML = '<span class="sp-n">0' + (i + 1) + '</span><span class="sp-l">' + s.label + '</span>';
  stops.appendChild(b);

  var p = document.createElement("div");
  p.className = "sp-panel"; p.id = "sp-panel-" + i; p.setAttribute("role", "tabpanel");
  p.setAttribute("aria-labelledby", b.id); p.tabIndex = 0;
  if (i !== 0) p.hidden = true;
  p.innerHTML = '<div class="sp-cols">' +
    '<div><p class="sp-k">What may be happening</p><p>' + s.happening + '</p></div>' +
    '<div><p class="sp-k">How I help</p><p>' + s.help + '</p></div>' +
    '<div><p class="sp-k">Best place to start</p><p>' + s.start + '</p></div>' +
    '<p class="sp-cta"><a class="arrow-link" href="' + s.href + '">' + s.cta + '</a></p></div>';
  panels.appendChild(p);
});

var btns = stops.querySelectorAll("button"), pans = panels.querySelectorAll(".sp-panel");
function select(n) {
  btns.forEach(function (b, i) {
    b.setAttribute("aria-selected", i === n ? "true" : "false");
    b.tabIndex = i === n ? 0 : -1;
  });
  nodes.forEach(function (c, i) { c.classList.toggle("on", i === n); });
  pans.forEach(function (p, i) {
    p.hidden = i !== n;
    if (i === n) { p.classList.remove("sp-in"); void p.offsetWidth; p.classList.add("sp-in"); }
  });
}
btns.forEach(function (b, i) {
  b.addEventListener("click", function () { select(i); });
  b.addEventListener("keydown", function (e) {
    var n = null;
    if (e.key === "ArrowRight" || e.key === "ArrowDown") n = (i + 1) % btns.length;
    if (e.key === "ArrowLeft" || e.key === "ArrowUp") n = (i - 1 + btns.length) % btns.length;
    if (e.key === "Home") n = 0;
    if (e.key === "End") n = btns.length - 1;
    if (n !== null) { e.preventDefault(); select(n); btns[n].focus(); }
  });
});
select(0);
</script>
</body>
</html>
