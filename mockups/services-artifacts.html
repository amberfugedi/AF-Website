<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Mockup — What are you bringing me?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../styles.css">
<style>
.mk-bar { position: sticky; top: 0; z-index: 40; background: var(--bg); border-bottom: 1px solid var(--line); padding: 11px 0; }
.mk-bar strong { font-family: var(--font-body); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--coral-deep); }
.ar-head h2 { margin-bottom: 10px; }
.ar-head p { color: var(--muted); max-width: 52ch; }

/* ---------- the worktable ---------- */
.ar-table { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0 clamp(-6px, -0.6vw, 0px); margin-top: clamp(34px, 4vw, 54px); align-items: start; }
.ar-doc { font-family: var(--font-body); background: none; border: 0; padding: 0; cursor: pointer;
  display: block; width: 100%; text-align: left; position: relative;
  transition: opacity .28s var(--ease); }
.ar-doc:nth-child(1) { margin-top: 22px; rotate: -1.3deg; z-index: 1; }
.ar-doc:nth-child(2) { margin-top: 0;    rotate: 0.9deg;  z-index: 2; margin-left: -5%; }
.ar-doc:nth-child(3) { margin-top: 26px; rotate: -0.7deg; z-index: 3; margin-left: -5%; }
.ar-doc:nth-child(4) { margin-top: 6px;  rotate: 1.4deg;  z-index: 4; margin-left: -5%; }
/* the SHEET fades back, never the label: an unpicked document should
   still be legible enough to choose. */
.ar-doc:not([aria-selected="true"]) .ar-sheet { opacity: .5; }
.ar-doc:hover .ar-sheet { opacity: .74; }
.ar-doc[aria-selected="true"] { z-index: 6; }
.ar-doc[aria-selected="true"] .ar-sheet { opacity: 1; }
.ar-sheet { transition: opacity .28s var(--ease); }

.ar-sheet { display: block; width: 100%; height: auto; background: #FFFDFA;
  border: 1px solid rgba(46, 42, 39, 0.1); border-radius: 2px; }
.ar-doc:nth-child(2) .ar-sheet { background: #FDF9F3; }
.ar-doc:nth-child(3) .ar-sheet { background: #FCF7F7; }
.ar-doc:nth-child(4) .ar-sheet { background: #FFFDFA; }
/* the coral pen only appears on the document you have picked up */
.ar-sheet .pen { opacity: 0; transition: opacity .3s var(--ease); }
.ar-doc[aria-selected="true"] .ar-sheet .pen { opacity: 1; }

.ar-tag { display: flex; align-items: baseline; gap: 10px; margin: 15px 0 0; padding-left: 2px; }
.ar-n { font-size: var(--fs-eyebrow); letter-spacing: .1em; font-weight: 600; color: var(--muted); transition: color .2s; }
.ar-l { font-size: var(--fs-body); line-height: 1.25; color: var(--body); position: relative; transition: color .2s; }
.ar-l::before { content: ""; position: absolute; inset: -4px -8px -3px -6px; border-radius: 2px;
  background: #FBE7A8; opacity: 0; transform: scaleX(.92); transform-origin: left center;
  transition: opacity .26s var(--ease), transform .26s var(--ease); z-index: -1; }
.ar-doc[aria-selected="true"] .ar-n { color: var(--coral-deep); }
.ar-doc[aria-selected="true"] .ar-l { color: var(--ink); font-weight: 600; }
.ar-doc[aria-selected="true"] .ar-l::before { opacity: 1; transform: scaleX(1); }

/* ---------- what the document says ---------- */
.ar-panel { margin-top: clamp(40px, 4.5vw, 64px); padding-top: 26px; border-top: 1px solid rgba(84, 76, 112, .22); }
.ar-panel[hidden] { display: none; }
.ar-cols { display: grid; grid-template-columns: minmax(0, 62fr) minmax(0, 38fr); gap: clamp(26px, 4vw, 72px); align-items: start; }
.ar-k { text-transform: uppercase; letter-spacing: .08em; font-weight: 600; font-size: var(--fs-eyebrow); color: var(--muted); margin: 0 0 7px; }
.ar-cols p:not(.ar-k) { color: var(--body); font-size: var(--fs-body); line-height: 1.55; margin: 0 0 20px; max-width: 52ch; }
.ar-cols .ar-cta { margin: 0; }
.ar-in { animation: ar-in .26s var(--ease) both; }
@keyframes ar-in { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .ar-in { animation: none; }
  .ar-doc, .ar-sheet, .ar-l, .ar-l::before, .ar-sheet .pen { transition: none; }
}

@media (max-width: 860px) {
  /* a staggered stack, never four accordions. Labels stay clear. */
  .ar-table { grid-template-columns: 1fr; gap: 14px; }
  .ar-doc { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 16px; align-items: center;
    margin: 0 !important; rotate: 0deg !important; }
  .ar-doc:nth-child(even) { padding-left: 22px; }
  .ar-tag { margin: 0; }
  .ar-cols { grid-template-columns: 1fr; gap: 22px; }
  .ar-cols p:not(.ar-k) { max-width: none; }
}
</style>
</head>
<body class="page-sub">
<div class="aura" aria-hidden="true"><span class="aura-blob aura-blob-1"></span><span class="aura-blob aura-blob-2"></span><span class="aura-blob aura-blob-3"></span></div>
<div class="mk-bar"><div class="wrap"><strong>Mockup · not linked from the site</strong></div></div>

<main><section><div class="wrap">
  <div class="ar-head">
    <h2 class="section-title">Choose your starting point</h2>
    <p>Different businesses need different kinds of help. Start with the situation that feels closest.</p>
  </div>
  <div class="ar-table" role="tablist" aria-label="Starting points"></div>
  <div class="ar-panels"></div>
</div></section></main>

<script>
var F = 'Newsreader, Georgia, serif', M = 'Manrope, system-ui, sans-serif';
function sheet(inner) {
  return '<svg class="ar-sheet" viewBox="0 0 210 160" fill="none" stroke-linecap="round" role="img">' + inner + '</svg>';
}
/* Drawn the way the working documents on My Approach are drawn: rules
   bow, corners do not close, the coral pen only ever annotates. */
var DOCS = [
 { // 01 — a mostly blank brief
  art: sheet(
   '<text x="18" y="26" fill="#8A827A" font-family="' + M + '" font-size="7" letter-spacing="1">BRIEF</text>' +
   '<g stroke="#3A3531" stroke-width="0.9" opacity="0.34">' +
   '<path d="M18 46 Q100 44.6 192 46.2"/><path d="M18 66 Q90 64.8 168 66.4"/>' +
   '<path d="M18 86 Q100 84.7 192 86.3"/><path d="M18 106 Q80 104.9 146 106.5"/></g>' +
   '<g class="pen"><text x="24" y="136" fill="#B8354A" font-family="' + F + '" font-style="italic" font-size="12">Where do we even start?</text>' +
   '<path d="M20 124 Q60 121 104 124.5" stroke="#B8354A" stroke-width="1.2"/></g>'),
  label: "No marketing yet",
  happening: "The business works, but marketing has never been clearly defined. You need clarity on what matters, what to build, and what can wait.",
  help: "I help create the positioning, priorities, and practical foundation the business actually needs.",
  start: "Build Your Marketing Foundation or a focused strategy engagement.",
  cta: "Explore the course", href: "../courses.html" },
 { // 02 — one page carrying everything
  art: sheet(
   '<text x="18" y="24" fill="#8A827A" font-family="' + M + '" font-size="7" letter-spacing="1">THIS WEEK</text>' +
   '<g fill="#3A3531" font-family="' + F + '" font-style="italic" font-size="11">' +
   '<text x="18" y="46">Website</text><text x="104" y="42">Emails</text>' +
   '<text x="18" y="68">Social</text><text x="96" y="72">Follow up</text>' +
   '<text x="18" y="90">Fix this</text><text x="112" y="94">Newsletter</text>' +
   '<text x="18" y="112">Deck</text><text x="86" y="116">Reporting</text></g>' +
   '<g stroke="#3A3531" stroke-width="0.9" opacity="0.4"><path d="M17 62 Q42 60 66 62.4"/><path d="M17 106 Q38 104 58 106.4"/></g>' +
   '<g class="pen" stroke="#B8354A" stroke-width="1.2">' +
   '<path d="M14 86 Q40 83.6 68 86.6"/><path d="M150 60 Q160 92, 132 120"/><path d="M132 120 L141 116 M132 120 L140 125"/></g>' +
   '<g class="pen"><text x="120" y="140" fill="#B8354A" font-family="' + F + '" font-style="italic" font-size="11">all mine</text></g>'),
  label: "It all depends on me",
  happening: "Marketing lives in your head, your calendar, and a collection of disconnected people or tools.",
  help: "I simplify the work, create clearer systems, and reduce how much depends on one person.",
  start: "Workflow and AI advisory or focused consulting.",
  cta: "See how I work", href: "../my-approach.html" },
 { // 03 — two sheets that disagree
  art: sheet(
   '<g stroke="#3A3531" stroke-width="1" opacity="0.5">' +
   '<path d="M96 14 L196 16 L194 118 L94 116 L95.6 22"/></g>' +
   '<rect x="10" y="30" width="104" height="112" fill="#FFFDFA" opacity="0.96"/>' +
   '<g stroke="#3A3531" stroke-width="1" opacity="0.55"><path d="M12 32 L112 30 L114 138 L14 140 L12.4 40"/></g>' +
   '<text x="22" y="52" fill="#8A827A" font-family="' + M + '" font-size="6.5" letter-spacing="1">MARKETING</text>' +
   '<text x="22" y="74" fill="#3A3531" font-family="' + F + '" font-style="italic" font-size="11">Launch now</text>' +
   '<text x="106" y="44" fill="#8A827A" font-family="' + M + '" font-size="6.5" letter-spacing="1">SALES</text>' +
   '<text x="106" y="66" fill="#3A3531" font-family="' + F + '" font-style="italic" font-size="11">Wait for us</text>' +
   '<g class="pen" stroke="#B8354A" stroke-width="1.2">' +
   '<path d="M84 88 Q60 96 40 90"/><path d="M40 90 L48 87 M40 90 L47 94"/>' +
   '<path d="M120 88 Q146 96 168 90"/><path d="M168 90 L160 87 M168 90 L161 94"/></g>' +
   '<g class="pen"><text x="46" y="132" fill="#B8354A" font-family="' + F + '" font-style="italic" font-size="11.5">who owns this?</text></g>'),
  label: "The team is not aligned",
  happening: "There is plenty of activity, but priorities, ownership, messaging, or decisions are not working together.",
  help: "I find where the work is breaking down and help the team move the right changes forward.",
  start: "Strategic consulting, fractional leadership, or a cross-functional project.",
  cta: "See the expertise in action", href: "../expertise.html" },
 { // 04 — a calm page with one note in the margin
  art: sheet(
   '<text x="52" y="28" fill="#8A827A" font-family="' + M + '" font-size="7" letter-spacing="1">NOTES</text>' +
   '<path d="M44 16 Q42 80 44 146" stroke="#3A3531" stroke-width="0.9" opacity="0.3"/>' +
   '<g stroke="#3A3531" stroke-width="0.9" opacity="0.32">' +
   '<path d="M52 48 Q120 46.6 190 48.2"/><path d="M52 66 Q112 64.8 172 66.4"/>' +
   '<path d="M52 84 Q124 82.7 194 84.3"/><path d="M52 102 Q104 100.9 156 102.5"/></g>' +
   '<g class="pen"><path d="M40 118 Q100 115 172 118.6" stroke="#B8354A" stroke-width="1.2"/>' +
   '<text x="40" y="138" fill="#B8354A" font-family="' + F + '" font-style="italic" font-size="12">Talk this through with me.</text></g>'),
  label: "I need someone in my corner",
  happening: "You are leading the work, growing into a larger role, or making difficult decisions without an experienced person to pressure-test them with.",
  help: "I provide practical guidance, honest perspective, and ongoing thought partnership.",
  start: "One-to-one mentoring or marketing leadership advisory.",
  cta: "Ask about mentoring", href: "../about.html#contact" }
];

var table = document.querySelector(".ar-table"), panels = document.querySelector(".ar-panels");
DOCS.forEach(function (d, i) {
  var b = document.createElement("button");
  b.type = "button"; b.className = "ar-doc"; b.setAttribute("role", "tab");
  b.id = "ar-tab-" + i; b.setAttribute("aria-controls", "ar-panel-" + i);
  b.setAttribute("aria-selected", i === 0 ? "true" : "false");
  b.tabIndex = i === 0 ? 0 : -1;
  b.innerHTML = d.art.replace('role="img"', 'role="img" aria-label="' + d.label + '"') +
    '<span class="ar-tag"><span class="ar-n">0' + (i + 1) + '</span><span class="ar-l">' + d.label + '</span></span>';
  table.appendChild(b);

  var p = document.createElement("div");
  p.className = "ar-panel"; p.id = "ar-panel-" + i; p.setAttribute("role", "tabpanel");
  p.setAttribute("aria-labelledby", b.id); p.tabIndex = 0;
  if (i !== 0) p.hidden = true;
  p.innerHTML = '<div class="ar-cols"><div>' +
    '<p class="ar-k">What may be happening</p><p>' + d.happening + '</p>' +
    '<p class="ar-k">How I help</p><p>' + d.help + '</p></div><div>' +
    '<p class="ar-k">Best place to start</p><p>' + d.start + '</p>' +
    '<p class="ar-cta"><a class="arrow-link" href="' + d.href + '">' + d.cta + '</a></p></div></div>';
  panels.appendChild(p);
});

var btns = table.querySelectorAll("button"), pans = panels.querySelectorAll(".ar-panel");
function select(n) {
  btns.forEach(function (b, i) {
    b.setAttribute("aria-selected", i === n ? "true" : "false");
    b.tabIndex = i === n ? 0 : -1;
  });
  pans.forEach(function (p, i) {
    p.hidden = i !== n;
    if (i === n) { p.classList.remove("ar-in"); void p.offsetWidth; p.classList.add("ar-in"); }
  });
}
btns.forEach(function (b, i) {
  b.addEventListener("click", function () { select(i); });
  b.addEventListener("keydown", function (e) {
    var n = null;
    if (e.key === "ArrowRight" || e.key === "ArrowDown") n = (i + 1) % btns.length;
    if (e.key === "ArrowLeft" || e.key === "ArrowUp") n = (i - 1 + btns.length) % btns.length;
    if (e.key === "Home") n = 0;
    if (e.key === "End") n = btns.length - 1;
    if (n !== null) { e.preventDefault(); select(n); btns[n].focus(); }
  });
});
select(0);
</script>
</body>
</html>
