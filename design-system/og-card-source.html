<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- SOURCE FOR og-image-v2.jpg. Author here, render at 1200x630 with
     deviceScaleFactor 2 to get the 2400x1260 the meta tags declare, then
     save as progressive JPEG at quality 88 (~150KB).

     The brand mark is pulled from the running local server; point it at
     /brand-mark.png or inline it as a data URI if you render this
     standalone. The four clouds are the site's own aura, static, at 72%
     with an 84px blur — the live blobs are sized in vw and land on
     these pixel values at a 1200px viewport. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FDF9F5; --ink:#2E2A27; --muted:#524B43; --coral-deep:#B8354A;
  --font-display:"Newsreader",Georgia,serif;
  --font-body:"Manrope",-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:630px;background:var(--bg);font-family:var(--font-body);overflow:hidden}
.card{position:relative;width:1200px;height:630px;overflow:hidden;background:var(--bg)}
.aura{position:absolute;inset:0;overflow:hidden;opacity:.72}
.blob{position:absolute;border-radius:50%;filter:blur(84px)}
/* the site's own four clouds, static */
.b1{width:600px;height:600px;top:-108px;left:-96px;
    background:radial-gradient(circle at 40% 40%, rgba(246,158,199,.95), rgba(251,213,228,0) 60%)}
.b2{width:528px;height:528px;top:-76px;right:-120px;
    background:radial-gradient(circle at 55% 45%, rgba(248,190,116,.95), rgba(252,228,196,0) 60%)}
.b3{width:480px;height:480px;top:164px;left:336px;
    background:radial-gradient(circle at 50% 50%, rgba(172,158,232,.92), rgba(218,212,245,0) 60%)}
.b4{width:384px;height:384px;bottom:-88px;right:72px;
    background:radial-gradient(circle at 50% 50%, rgba(158,205,148,.30), rgba(217,239,211,0) 62%)}

.inner{position:relative;height:100%;padding:64px 72px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:34px;height:34px;display:block;border-radius:8px}
.brand span{font-family:var(--font-display);font-weight:500;font-size:30px;
  letter-spacing:-0.015em;color:var(--ink)}
.brand em{font-style:normal;color:var(--coral-deep)}

.head{margin-top:auto;margin-bottom:auto;max-width:1000px}
h1{font-family:var(--font-display);font-weight:500;font-size:72px;line-height:1.1;
  letter-spacing:-0.02em;color:var(--ink)}
h1 i{font-style:italic;color:var(--coral-deep);position:relative;white-space:nowrap}
.swoosh{position:absolute;left:-1%;right:-7%;bottom:-21px;color:var(--coral-deep)}
.swoosh svg{display:block;width:100%;height:auto}

.foot{display:flex;align-items:baseline;justify-content:space-between}
.pillars{font-size:24px;font-weight:500;color:var(--muted);letter-spacing:0.01em}
.pillars b{font-weight:500}
.dot{color:var(--muted);opacity:.55;padding:0 10px}
.url{font-size:24px;font-weight:600;color:var(--coral-deep);letter-spacing:-0.005em}
</style>
</head>
<body>
<div class="card">
  <div class="aura">
    <span class="blob b1"></span><span class="blob b2"></span>
    <span class="blob b3"></span><span class="blob b4"></span>
  </div>
  <div class="inner">
    <div class="brand">
      <img src="http://127.0.0.1:8766/brand-mark.png" alt="">
      <span>Amber <em>Fugedi</em></span>
    </div>

    <div class="head">
      <h1>Building the marketing your business actually <i>needs.<span class="swoosh">
        <svg viewBox="0 0 240 13" fill="none" aria-hidden="true">
          <path d="M3.5 9.4C48 4.2 130 2 236.5 5.2" stroke="currentColor" stroke-width="3.4"
                stroke-linecap="round"/>
        </svg></span></i></h1>
    </div>

    <div class="foot">
      <p class="pillars">Leading<span class="dot">·</span>Consulting<span class="dot">·</span>Building</p>
      <p class="url">amberfugedi.com</p>
    </div>
  </div>
</div>
</body>
</html>
